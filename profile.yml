description: Profile for Web applications
skeleton:
    executable: ["**/gradlew*", "**/grailsw*"]
    binaryExtensions: ['png', 'gif', 'jpg', 'jpeg', 'ico', 'icns', 'pdf', 'zip', 'jar', 'class', 'woff', 'woff2']
features:
    defaults:
        - asset-pipeline
        - async
        - bootstrap
        - cache
        - database-migration
        - events
        - fields
        - gsp
        - hibernate
        - jquery
        - scaffolding
build:
    plugins:
        - war
        - org.graceframework.grace-app
    excludes:
        - org.graceframework.grace-core
dependencies:
    - scope: console
      coords: "org.graceframework:grace-console"
    - scope: compile
      coords: "org.graceframework:grace-boot-logging"
    - scope: compile
      coords: "org.graceframework:grace-boot-persistence"
    - scope: compile
      coords: "org.graceframework:grace-boot-plugin"
    - scope: compile
      coords: "org.graceframework:grace-boot-validation"
    - scope: compile
      coords: "org.graceframework:grace-boot-web"
    - scope: compile
      coords: "org.graceframework:grace-plugin-services"
